      <div class="mode-btn" data-mode="coordinacion">🎯 Coordinación</div>
    </div>
    <div id="schedule-body"></div>
    <div id="chosen-bounces"></div>
    <button class="btn-primary" id="confirm-schedule-btn" disabled>Confirmar rebotes</button>
  `);
  document.getElementById('save-only-btn').addEventListener('click', ()=>{
    closeOverlay();
    showToast('Guardado. Podés programarlo después desde "En tránsito".');
  });
  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      scheduleMode=btn.dataset.mode;
      chosenBounces=[];
      renderScheduleBody();
      renderChosenBounces();
    });
  });
  document.getElementById('confirm-schedule-btn').addEventListener('click', confirmSchedule);
  renderScheduleBody();
}

function renderScheduleBody(){
  const body=document.getElementById('schedule-body');
  if(scheduleMode==='deriva'){
    body.innerHTML=`
      <div class="preset-grid" id="preset-grid"></div>
      <div class="custom-date-row">
        <input type="datetime-local" id="custom-date">
        <button class="mini-btn" id="add-custom-btn">+ fecha propia</button>
      </div>
    `;
    const grid=document.getElementById('preset-grid');
    Object.entries(PRESETS).forEach(([key,p])=>{
      const card=document.createElement('div');
      card.className='preset-card';
      card.innerHTML=`<div class="p-title">${p.label}</div><div class="p-desc">${p.desc}</div>`;
      card.addEventListener('click',()=>{
        chosenBounces=p.bounces.map(b=>({label:b.label, timestamp:Date.now()+b.ms}));
        document.querySelectorAll('.preset-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        renderChosenBounces();
      });
      grid.appendChild(card);
    });
    document.getElementById('add-custom-btn').addEventListener('click',()=>{
      const input=document.getElementById('custom-date');
      if(!input.value) return;
      const ts=new Date(input.value).getTime();
      if(ts<=Date.now()){ showToast('Elegí una fecha en el futuro.'); return; }
      chosenBounces.push({label:'fecha propia · '+new Date(ts).toLocaleDateString('es-CL'), timestamp:ts});
      document.querySelectorAll('.preset-card').forEach(c=>c.classList.remove('selected'));
      renderChosenBounces();
      input.value='';
    });
  } else {
    body.innerHTML=`
      <div class="coord-copy">Elegí el instante exacto en que querés encontrarte con vos mismo —
      el punto del futuro donde esperás que la conexión pase, y que estés ahí, escuchando.</div>
      <div class="custom-date-row">
        <input type="datetime-local" id="coord-date">
      </div>
      <label class="repeat-row">
        <input type="checkbox" id="coord-repeat-check"> repetir este encuentro
      </label>
      <div class="repeat-details" id="coord-repeat-details">
        <select id="coord-interval">
          <option value="${7*24*3600*1000}">cada semana</option>
          <option value="${30*24*3600*1000}">cada mes</option>
          <option value="${182*24*3600*1000}">cada 6 meses</option>
          <option value="${365*24*3600*1000}">cada año</option>
        </select>
        <input type="number" id="coord-repeats" min="2" max="12" value="3" style="width:64px;"> veces
      </div>
    `;
    const dateInput=document.getElementById('coord-date');
    const buildCoordBounces=()=>{
      if(!dateInput.value) return;
      const ts=new Date(dateInput.value).getTime();
      if(ts<=Date.now()){ showToast('Elegí una fecha en el futuro.'); return; }
      const repeatOn=document.getElementById('coord-repeat-check').checked;
      chosenBounces=[{label:'encuentro · '+new Date(ts).toLocaleDateString('es-CL'), timestamp:ts}];
      if(repeatOn){
        const interval=parseInt(document.getElementById('coord-interval').value,10);
        const reps=Math.min(12,Math.max(2,parseInt(document.getElementById('coord-repeats').value,10)||3));
        for(let i=1;i<reps;i++){
          chosenBounces.push({label:'encuentro '+(i+1)+' · '+new Date(ts+interval*i).toLocaleDateString('es-CL'), timestamp:ts+interval*i});
        }
      }
      renderChosenBounces();
    };
    dateInput.addEventListener('change', buildCoordBounces);
    document.getElementById('coord-repeat-check').addEventListener('change', e=>{
      document.getElementById('coord-repeat-details').classList.toggle('show', e.target.checked);
      buildCoordBounces();
    });
    document.getElementById('coord-interval').addEventListener('change', buildCoordBounces);
    document.getElementById('coord-repeats').addEventListener('input', buildCoordBounces);
  }
}

function renderChosenBounces(){
  chosenBounces.sort((a,b)=>a.timestamp-b.timestamp);
  const wrap=document.getElementById('chosen-bounces');
  wrap.innerHTML='';
  chosenBounces.forEach((b,i)=>{
    const chip=document.createElement('div');
    chip.className='bounce-chip';
    chip.innerHTML=`<span>${b.label}</span><span class="x" data-i="${i}">✕</span>`;
    chip.querySelector('.x').addEventListener('click',()=>{ chosenBounces.splice(i,1); renderChosenBounces(); });
    wrap.appendChild(chip);
  });
  document.getElementById('confirm-schedule-btn').disabled = chosenBounces.length===0;
}

async function confirmSchedule(){
  if(!pendingMessage || chosenBounces.length===0) return;
  pendingMessage.bounces=chosenBounces.map(b=>({label:b.label, timestamp:b.timestamp, arrived:false, opened:false}));
  await dbPut('messages', pendingMessage);
  await playThrowPreview(pendingMessage.bounces.length);
  pendingMessage=null;
  closeOverlay();
  showToast('Rebotes programados sobre el agua.');
  refreshLists();
}

async function deleteMessageCompletely(id){
  await dbDelete('messages', id);
  try{ await dbDelete('audio', id); }catch(e){}
  bovedaRemoveAudio(id);

  const aidx=audioCards.findIndex(sp=>sp.userData.msgId===id);
  if(aidx>=0){
    const sp=audioCards[aidx];
    pulsar.group.remove(sp);
    audioCards.splice(aidx,1);
    const mi=audioCardMeshes.indexOf(sp);
    if(mi>=0) audioCardMeshes.splice(mi,1);
    cardedAudioIds.delete(id);
  }
  const tidx=textCards.findIndex(sp=>sp.userData.msgId===id);
  if(tidx>=0){
    const sp=textCards[tidx];
    if(zoomedCard===sp) unzoomCard();
    pulsar.group.remove(sp);
    textCards.splice(tidx,1);
    const mi=textCardMeshes.indexOf(sp);
    if(mi>=0) textCardMeshes.splice(mi,1);
    cardedIds.delete(id);
  }
  refreshLists();
}

function getTagDefs(){
  try{ return JSON.parse(localStorage.getItem('kairos_tagdefs')||'[]'); }catch(e){ return []; }
}
function setTagDefs(arr){ localStorage.setItem('kairos_tagdefs', JSON.stringify(arr)); }
async function addTagDef(name){
  name=(name||'').trim();
  if(!name) return;
  const defs=getTagDefs();
  if(!defs.includes(name)){ defs.push(name); setTagDefs(defs); }
}
async function removeTagDef(name){
  setTagDefs(getTagDefs().filter(t=>t!==name));
  /* también se saca de todos los audios que la tenían */
  const all=await dbGetAll('messages');
  for(const msg of all){
    if(msg.tags && msg.tags.includes(name)){
      msg.tags=msg.tags.filter(t=>t!==name);
      await dbPut('messages', msg);
    }
  }
}

            return `<span class="mini-btn${on?' tag-on':''}" data-toggletag="${msg.id}" data-tag="${t.replace(/"/g,'&quot;')}" style="margin:3px 4px 0 0;display:inline-block;">${t.replace(/</g,'&lt;')}</span>`;
          }).join('');
      cardsHtml+=`
        <div class="msg-card">
          <div class="m-top"><span>${new Date(msg.createdAt).toLocaleDateString('es-CL')}</span>
          <span><span class="cal-link" data-delete="${msg.id}" style="color:#ff8d8d;">eliminar</span></span></div>
          <div class="custom-date-row" style="margin-bottom:8px;">
            <input type="text" data-titleinput="${msg.id}" value="${(msg.title||'').replace(/"/g,'&quot;')}" placeholder="ponele nombre..." style="flex:1;min-width:110px;">
            <button class="mini-btn" data-savetitle="${msg.id}">guardar</button>
          </div>
          <audio controls style="width:100%;margin-bottom:8px;" src="${src}"></audio>
          ${msg.buho ? `<div class="buho-line">${msg.buho.retorno
              ? `🦉 punto a los ${Math.round(msg.buho.latencia)} s · preámbulo ${Math.round(msg.buho.preambulo*100)}%`
              : '🦉 sin marca de punto'}</div>` : ''}
          <div>${tagToggleHtml}</div>
          ${scheduleHtml}
        </div>
      `;
    }
    wrap.innerHTML=managerHtml+cardsHtml;
  }

  document.getElementById('new-tagdef-btn').addEventListener('click', async ()=>{
    const input=document.getElementById('new-tagdef-input');
    await addTagDef(input.value);
    input.value='';
    renderAudios();
  });
  wrap.querySelectorAll('[data-deltag]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      await removeTagDef(el.dataset.deltag);
      renderAudios();
    });
  });
  wrap.querySelectorAll('.cal-link[data-schedule]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      pendingMessage=await dbGet('messages', el.dataset.schedule);
      openScheduleStep();
    });
  });
  wrap.querySelectorAll('.cal-link[data-delete]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(confirm('¿Eliminar este audio para siempre? No se puede deshacer.')){
        await deleteMessageCompletely(el.dataset.delete);
      }
    });
  });
  wrap.querySelectorAll('[data-toggletag]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id=el.dataset.toggletag, tag=el.dataset.tag;
      const msg=await dbGet('messages', id);
      if(!msg) return;
      msg.tags=msg.tags||[];
      if(msg.tags.includes(tag)) msg.tags=msg.tags.filter(t=>t!==tag);
      else msg.tags.push(tag);
      await dbPut('messages', msg);
      renderAudios();
    });
  });
  wrap.querySelectorAll('[data-savetitle]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id=el.dataset.savetitle;
      const input=wrap.querySelector(`[data-titleinput="${id}"]`);
      const msg=await dbGet('messages', id);
      if(!msg) return;
      msg.title=(input.value||'').trim();
      await dbPut('messages', msg);
      showToast('Nombre guardado.');
    });
  });
}

async function refreshLists(){
  const all=await dbGetAll('messages');
  const transito=document.getElementById('view-transito');
  const llegados=document.getElementById('view-llegados');
  transito.innerHTML=''; llegados.innerHTML='';
  let transitoCount=0, llegadosCount=0;
  syncTextCards();
  syncAudioCards();
  renderPlaybackTagFilter();
  renderAudios();
  const tagDefs=getTagDefs();

  all.sort((a,b)=>b.createdAt-a.createdAt).forEach(msg=>{
    const pendientes=msg.bounces.filter(b=>!b.arrived);
    const disponibles=msg.bounces.filter(b=>b.arrived && !b.opened);

    if(msg.bounces.length===0 || pendientes.length>0){
      transitoCount++;
      const card=document.createElement('div');
      card.className='msg-card';
      const preview=msg.text ? (msg.text.length>90?msg.text.slice(0,90)+'…':msg.text) : '(mensaje de voz)';
      const tagToggleHtml = (msg.text && tagDefs.length>0)
        ? '<div style="margin-bottom:6px;">'+tagDefs.map(t=>{
            const on=(msg.tags||[]).includes(t);
            return `<span class="mini-btn${on?' tag-on':''}" data-toggletxttag="${msg.id}" data-tag="${t.replace(/"/g,'&quot;')}" style="margin:3px 4px 0 0;display:inline-block;">${t.replace(/</g,'&lt;')}</span>`;
          }).join('')+'</div>'
        : '';
      card.innerHTML=`
        <div class="m-top"><span>${new Date(msg.createdAt).toLocaleDateString('es-CL')}</span>
        <span>${msg.hasAudio?'🎙️':''} ${msg.text?'✎':''}</span></div>
        <div class="m-preview">${preview}</div>
        ${tagToggleHtml}
      `;
      if(msg.bounces.length===0){
        const line=document.createElement('div');
        line.className='bounce-line';
        line.innerHTML=`<span>sin programar todavía</span><span class="cal-link" data-schedule="${msg.id}">programar ahora</span>`;
        card.appendChild(line);
      } else {
        msg.bounces.forEach(b=>{
          const line=document.createElement('div');
          line.className='bounce-line'+(b.arrived?' arrived':'');
          line.innerHTML=`<span>${b.arrived? '✓ llegó' : formatEta(b.timestamp)}</span>` +
            (b.arrived?'':`<span class="cal-link" data-ts="${b.timestamp}" data-label="${b.label}">🔔 calendario</span>`);
          card.appendChild(line);
        });
      }
      transito.appendChild(card);
    }

    if(disponibles.length>0){
      llegadosCount++;
      const card=document.createElement('div');
      card.className='msg-card';
      const preview=msg.text ? (msg.text.length>90?msg.text.slice(0,90)+'…':msg.text) : '(mensaje de voz)';
      card.innerHTML=`
        <div class="m-top"><span>escrito el ${new Date(msg.createdAt).toLocaleDateString('es-CL')}</span></div>
        <div class="m-preview">${preview}</div>
        <button class="arrived-btn" data-id="${msg.id}">abrir mensaje ✨</button>
      `;
      llegados.appendChild(card);
    }
  });

  document.getElementById('badge-transito').style.display = transitoCount>0?'inline-block':'none';
  document.getElementById('badge-transito').textContent=transitoCount;
  document.getElementById('badge-llegados').style.display = llegadosCount>0?'inline-block':'none';
  document.getElementById('badge-llegados').textContent=llegadosCount;
  document.getElementById('badge-toggle').style.display = llegadosCount>0?'inline-block':'none';
  document.getElementById('badge-toggle').textContent=llegadosCount;

  if(transitoCount===0) transito.innerHTML='<div class="empty-state">Todavía no hay piedras en camino.<br>Tocá el pulsar para escribirle a tu futuro.</div>';
  if(llegadosCount===0) llegados.innerHTML='<div class="empty-state">Cuando un rebote llegue a destino,<br>aparecerá acá para que lo abras.</div>';

  transito.querySelectorAll('.cal-link[data-ts]').forEach(el=>{
    el.addEventListener('click',()=>{
      makeICS('Kairós: un mensaje de tu pasado', 'Volvé al pulsar Kairós — un mensaje que te escribiste está por llegar.', parseInt(el.dataset.ts,10));
    });
  });
  transito.querySelectorAll('.cal-link[data-schedule]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      pendingMessage=await dbGet('messages', el.dataset.schedule);
      openScheduleStep();
    });
  });
  transito.querySelectorAll('[data-toggletxttag]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id=el.dataset.toggletxttag, tag=el.dataset.tag;
      const msg=await dbGet('messages', id);
      if(!msg) return;
      msg.tags=msg.tags||[];
      if(msg.tags.includes(tag)) msg.tags=msg.tags.filter(t=>t!==tag);
      else msg.tags.push(tag);
      await dbPut('messages', msg);
      refreshLists();
    });
  });
  llegados.querySelectorAll('.arrived-btn').forEach(el=>{
    el.addEventListener('click',()=>openArrivedMessage(el.dataset.id));
  });
}

async function openArrivedMessage(id){
  const msg=await dbGet('messages', id);
  if(!msg) return;
  const bounce=msg.bounces.find(b=>b.arrived && !b.opened);
  if(!bounce) return;

  let audioHtml='';
  if(msg.hasAudio){
    const rec=await dbGet('audio', id);
    if(rec) audioHtml=`<audio controls autoplay src="${URL.createObjectURL(rec.blob)}"></audio>`;
  }
  showOverlay(`
    <div class="o-label">Mensaje del pasado · ${bounce.label}</div>
    <div class="o-body">${(msg.text||'').replace(/</g,'&lt;')}</div>
    ${audioHtml}
    <button class="btn-ghost" id="close-arrived">cerrar</button>
  `);
  document.getElementById('close-arrived').addEventListener('click', closeOverlay);

  bounce.opened=true;
  await dbPut('messages', msg);
  const total=addResonancia(1);
  pulsar.setResonancia(total);
  pulsar.flash();
  refreshLists();
}

/* ---------------------------------------------------------------------
   9. VIGÍA DE REBOTES
   --------------------------------------------------------------------- */
async function checkArrivals(){
  const all=await dbGetAll('messages');
  let anyArrived=false;
  for(const msg of all){
    let changed=false;
    for(const b of msg.bounces){
      if(!b.arrived && b.timestamp<=Date.now()){ b.arrived=true; changed=true; anyArrived=true; }
    }
    if(changed){
      await dbPut('messages', msg);
      pulsar.flash();
      if(Notification && Notification.permission==='granted'){
        new Notification('Kairós', {body:'Un mensaje de tu pasado llegó a la orilla.'});
      }
    }
  }
  if(anyArrived){
    plunk(620,0.5);
    showToast('Un rebote llegó a destino. Revisá "Llegados".');
    refreshLists();
  }
}
setInterval(checkArrivals, 15000);

/* ---------------------------------------------------------------------
   11. MODO ALEATORIO — REPRODUCIR
   --------------------------------------------------------------------- */
let shuffling=false, advanceTimer=null;
let playHistory=[], historyIndex=-1;
const playBtn=document.getElementById('play-big-btn');
const skipBtn=document.getElementById('skip-btn');
const prevBtn=document.getElementById('prev-btn');
const nowPlaying=document.getElementById('now-playing');
const nowPlayingAudio=document.getElementById('now-playing-audio');

function clearAdvanceTimer(){ if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer=null; } }

let selectedPlaybackTags=new Set();

function messagePassesTagFilter(msg){
  if(selectedPlaybackTags.size===0) return true; // sin selección = suena todo
  const tags=msg.tags||[];
  return tags.some(t=>selectedPlaybackTags.has(t));
}

async function getPlaybackPool(){
  const all=await dbGetAll('messages');
  return all.filter(m=>(m.hasAudio||m.text) && messagePassesTagFilter(m)).map(m=>m.id);
}

function renderPlaybackTagFilter(){
  const defs=getTagDefs();
  const wrap=document.getElementById('playback-tag-filter');
  if(!wrap) return;
  /* limpia de la selección cualquier etiqueta que ya no exista */
  selectedPlaybackTags.forEach(t=>{ if(!defs.includes(t)) selectedPlaybackTags.delete(t); });
  if(defs.length===0){ wrap.innerHTML=''; return; }
  wrap.innerHTML=defs.map(t=>{
    const on=selectedPlaybackTags.has(t);
    return `<span class="mini-btn${on?' tag-on':''}" data-playtag="${t.replace(/"/g,'&quot;')}">${t.replace(/</g,'&lt;')}</span>`;
  }).join('');
  wrap.querySelectorAll('[data-playtag]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t=el.dataset.playtag;
      if(selectedPlaybackTags.has(t)) selectedPlaybackTags.delete(t);
      else selectedPlaybackTags.add(t);
      renderPlaybackTagFilter();
    });
  });
}

async function playPick(msgId){
  clearAdvanceTimer();
  nowPlayingAudio.onended=null;
  const msg=await dbGet('messages', msgId);
  if(!msg){ playNext(); return; }

  pulsar.flash();
  shuffling=true;
  playBtn.classList.add('playing');
  playBtn.textContent='❚❚';
  nowPlayingAudio.pause();

  let willAutoAdvanceAfter=4200;
  currentlyPlayingId=null;

  if(msg.hasAudio){
    const rec=await dbGet('audio', msg.id);
    if(rec){
      currentlyPlayingId=msg.id;
      nowPlaying.textContent='🎙️ '+new Date(msg.createdAt).toLocaleDateString('es-CL');
      attachAnalyserToPlayback(nowPlayingAudio);
      nowPlayingAudio.src=URL.createObjectURL(rec.blob);
      nowPlayingAudio.play().catch(()=>{});
      /* pausa de 2 segundos de silencio entre un audio y el siguiente */
      nowPlayingAudio.onended=()=>{ if(shuffling) advanceTimer=setTimeout(()=>{ if(shuffling) playNext(); }, 2000); };
      willAutoAdvanceAfter=null;
    }
  } else {
    const preview=(msg.text||'').slice(0,54);
    nowPlaying.textContent='✎ '+preview+(msg.text&&msg.text.length>54?'…':'');
  }

  if(willAutoAdvanceAfter){
    advanceTimer=setTimeout(()=>{ if(shuffling) playNext(); }, willAutoAdvanceAfter);
  }
}

let shuffleBag=[];
function shuffleArray(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
async function pickNextFromBag(){
  const pool=await getPlaybackPool();
  if(pool.length===0) return null;
  shuffleBag=shuffleBag.filter(id=>pool.includes(id)); // por si algo se borró o el filtro cambió
  if(shuffleBag.length===0){
    shuffleBag=shuffleArray(pool);
    /* que la vuelta nueva no arranque justo con lo último que sonó */
    if(shuffleBag.length>1 && shuffleBag[shuffleBag.length-1]===currentlyPlayingId){
      [shuffleBag[shuffleBag.length-1], shuffleBag[shuffleBag.length-2]]=[shuffleBag[shuffleBag.length-2], shuffleBag[shuffleBag.length-1]];
    }
  }
  return shuffleBag.pop();
}

async function playNext(){
  clearAdvanceTimer();
  if(historyIndex < playHistory.length-1){
    historyIndex++;
    await playPick(playHistory[historyIndex]);
    return;
  }
  const msgId=await pickNextFromBag();
  if(!msgId){
    showToast('Todavía no grabaste ni escribiste nada para reproducir.');
    stopShuffle();
    return;
  }
  playHistory.push(msgId);
  historyIndex=playHistory.length-1;
  await playPick(msgId);
}

async function playPrevious(){
  if(historyIndex<=0){ showToast('No hay nada anterior todavía.'); return; }
  historyIndex--;
  await playPick(playHistory[historyIndex]);
}

function stopShuffle(){
  shuffling=false;
  clearAdvanceTimer();
  playBtn.classList.remove('playing');
  playBtn.textContent='▶';
  nowPlayingAudio.onended=null;
  nowPlayingAudio.pause();
  currentlyPlayingId=null;
}

playBtn.addEventListener('click', async ()=>{
  if(shuffling){ stopShuffle(); return; }
  audioReactSource='central';
  await playNext();
});
skipBtn.addEventListener('click', ()=>{ audioReactSource='central'; playNext(); });
prevBtn.addEventListener('click', ()=>{ audioReactSource='central'; playPrevious(); });

/* ---------------------------------------------------------------------
   13. LOOP PRINCIPAL
   --------------------------------------------------------------------- */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  try{
    const t=clock.getElapsedTime();
    const level=getAudioLevel();
    pulsar.update(t, audioReactSource==='central' ? level : 0);
    updateTextCards(t);
    updateAudioCards(t, audioReactSource==='orb' ? level : 0);
    reflection.material.opacity=0.16+Math.sin(t*0.9)*0.05;
    controls.update();
    if(useBloom && composer) composer.render(); else renderer.render(scene, camera);
  }catch(e){
    console.warn('Error en un frame de animación, sigo con el siguiente:', e);
  }
}
animate();

    parseInt(localStorage.getItem('kairos_last_backup')||'0',10),
    parseInt(localStorage.getItem('kairos_last_drive_sync')||'0',10)
  );
  const daysSince=(Date.now()-last)/(24*3600*1000);
  if(last===0){
    // primera vez: no asustar, solo un aviso suave si ya hay algo grabado
    dbGetAll('messages').then(all=>{
      if(all.some(m=>m.hasAudio)) showToast('Tip: tocá "💾 respaldo" arriba para no perder tus audios.', 6000);
    });
  } else if(daysSince>7){
    showToast('Hace más de una semana que no respaldás tus mensajes — tocá "💾 respaldo".', 6000);
  }
}, 2500);
